<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모은 문제 · 그깽 족보</title>
    <link rel="stylesheet" href="styles.css?v=20261114i">
    <script src="js/choice-collector.js?v=20261114b"></script>
    <style>
        .cc-wrap { padding: 20px; }
        .cc-lead { color: #666; font-size: 0.92em; line-height: 1.6; margin-bottom: 18px; }
        .cc-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 18px; }
        .cc-card { border: 1px solid #e0e0e0; border-left: 2px solid #000; padding: 12px 14px; background: #fff; }
        .cc-card .n { font-size: 1.6em; font-weight: 700; color: #000; }
        .cc-card .t { font-size: 0.82em; color: #666; margin-top: 2px; }
        .cc-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .cc-tools input { flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid #e0e0e0; font-size: 0.95em; }
        .cc-btn { border: 1px solid #000; background: #fff; color: #000; padding: 8px 14px; cursor: pointer; font-size: 0.9em; text-decoration: none; display: inline-flex; align-items: center; }
        .cc-btn:hover { background: #000; color: #fff; }
        .cc-btn.primary { background: #000; color: #fff; }
        .cc-btn.primary:hover { background: #333; }
        .cc-btn:disabled { opacity: 0.5; cursor: default; }
        .cc-msg { font-size: 0.88em; color: #444; min-height: 1.2em; margin: 4px 0 0; }
        .cc-msg.err { color: #c62828; }
        .cc-del { border: 1px solid #ddd; background: #fff; color: #999; padding: 2px 8px; font-size: 0.8em; cursor: pointer; white-space: nowrap; }
        .cc-del:hover { border-color: #c62828; color: #c62828; }
        .cc-acts { white-space: nowrap; }
        .cc-acts .cc-del + .cc-del { margin-left: 4px; }
        .cc-edit:hover, .cc-save:hover { border-color: #000; color: #000; }
        .cc-save { border-color: #000; color: #000; }
        .cc-input { width: 100%; min-width: 120px; padding: 6px 8px; border: 1px solid #000; font: inherit; box-sizing: border-box; resize: vertical; }
        tr.editing td { background: #fffbe6; }
        .cc-section { margin-top: 26px; }
        .cc-section h3 { font-size: 1.05em; margin-bottom: 10px; }
        .cc-section h3 .count { color: #999; font-weight: 400; font-size: 0.85em; margin-left: 4px; }
        .cc-table-wrap { overflow-x: auto; border: 1px solid #e0e0e0; }
        .cc-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .cc-table th, .cc-table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
        .cc-table th { color: #666; font-weight: 600; background: #fafafa; white-space: nowrap; }
        .cc-table tr:last-child td { border-bottom: 0; }
        .cc-table td.ans { font-weight: 600; color: #000; }
        .cc-empty { color: #888; border: 1px dashed #ddd; padding: 16px; font-size: 0.92em; line-height: 1.6; }
        .cc-badge { display: inline-block; padding: 2px 8px; font-size: 0.8em; white-space: nowrap; border: 1px solid #ddd; }
        .cc-badge.merged { background: #000; color: #fff; border-color: #000; }
        .cc-badge.sent { background: #fff; color: #000; border-color: #000; }
        .cc-badge.waiting { background: #fff; color: #999; }
        .cc-note { color: #999; font-size: 0.82em; margin-top: 8px; }
        @media (max-width: 600px) { .header { padding: 14px 16px; } .cc-wrap { padding: 16px; } }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>📥 모은 문제</h2>
            <a class="cc-btn" href="./">← 족보 검색으로</a>
        </div>

        <div class="cc-wrap">
            <p class="cc-lead">
                자동족보로 문제를 풀다가 <b>족보에 없던 문제</b>가 나오면, 정답 화면에서 답을 읽어 여기에 모아요.
                모은 문제는 바로 검색에 쓰이고, 서버로 보내져 매일 밤 족보에 합쳐집니다.
                정답 화면까지 읽어야 모이니 카메라 창의 <b>'중단없이'</b>를 켜 두세요.
            </p>

            <div class="cc-cards" id="cards"></div>

            <div class="cc-tools">
                <input id="filter" type="search" placeholder="질문이나 답으로 찾기...">
                <button class="cc-btn primary" id="mergeBtn" type="button" hidden>⚡ 족보에 바로 반영하기</button>
                <button class="cc-btn" id="downloadBtn" type="button">파일로 내려받기</button>
            </div>
            <p class="cc-msg" id="uploadMsg"></p>
            <div class="cc-tools" id="adminBox" hidden>
                <input id="adminKey" type="password" placeholder="관리자 키 (이 브라우저에만 저장돼요)" autocomplete="off">
                <button class="cc-btn" id="adminSave" type="button">관리자 키 저장</button>
            </div>

            <div class="cc-section">
                <h3>이 브라우저에서 모은 문제 <span class="count" id="mineCount"></span></h3>
                <div id="mine"></div>
            </div>

            <div class="cc-section">
                <h3>족보에 새로 추가된 수집 문제 <span class="count" id="mergedCount"></span></h3>
                <div id="merged"></div>
                <p class="cc-note" id="mergedNote"></p>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            function readJson(key, fallback) {
                try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
                catch (e) { return fallback; }
            }
            // 띄어쓰기·기호·닉네임 꼬리를 무시하고 같은 문제인지 비교
            function qk(s) { return String(s || '').replace(/[^0-9A-Za-z가-힣]/g, '').toLowerCase(); }
            function ak(s) { return qk(String(s || '').split('/')[0].split(/[★☆*※•]/)[0].split(/\s-/)[0]); }

            function table(headers, rows) {
                return '<div class="cc-table-wrap"><table class="cc-table"><thead><tr>' +
                    headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
                    '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
            }

            var unmerged = [];
            var lastStatus = null;
            var mineList = [];
            var NL = String.fromCharCode(10);

            function render(status) {
                lastStatus = status;
                var store = readJson('qplay:collected:v1', {});
                var outbox = readJson('qplay:collected:outbox', []);
                var merged = (status && status.merged) || [];

                var tidy = (window.QplayCollect && window.QplayCollect.tidy) || function (s) { return s; };
                // 족보에 들어간 문제는 정리·교정된 질문으로 저장되므로, 정리한 질문끼리 비교한다
                // 질문만 비슷하면 '수입의 예'와 '수출의 예'처럼 한 글자 다른 다른 문제를 같다고 보므로, 답도 맞아야 반영된 것으로 본다
                var mergedKeys = merged.map(function (m) { return { q: qk(m.q), a: qk(tidy(m.a, false)) }; });
                function nearlySame(x, y, minContain) {
                    if (x === y) return true;
                    if (Math.min(x.length, y.length) >= minContain && (x.indexOf(y) >= 0 || y.indexOf(x) >= 0)) return true;
                    if (x.length !== y.length) return false;
                    var diff = 0; // 한두 글자만 다른 경우 (손으로 고친 오타: 빚은 → 빛은, 노량대접 → 노량대첩)
                    for (var i = 0; i < x.length && diff <= 2; i++) if (x[i] !== y[i]) diff++;
                    return diff <= (x.length >= 4 ? 2 : 1);
                }
                function isMerged(question, answer) {
                    var k = qk(tidy(question, true));
                    var a = qk(tidy(answer, false));
                    if (k.length < 4 || !a) return false;
                    return mergedKeys.some(function (m) {
                        // 질문이 글자까지 같으면 반영된 것 (깨져 읽힌 답을 손으로 고친 경우: 카 카 오 복 베 → 카카오톡)
                        if (m.q === k) return true;
                        return nearlySame(m.q, k, 8) && nearlySame(m.a, a, 2);
                    });
                }
                var outboxKeys = {};
                outbox.forEach(function (o) { outboxKeys[qk(o.question) + '|' + ak(o.answer)] = true; });

                var mine = [];
                Object.keys(store).forEach(function (sheet) {
                    (store[sheet] || []).forEach(function (c) { mine.push({ sheet: sheet, c: c }); });
                });
                mine.sort(function (a, b) { return String(b.c.time || '').localeCompare(String(a.c.time || '')); });
                mineList = mine;

                var mergedMine = 0, waiting = 0;
                unmerged = [];
                var mineRows = mine.map(function (m, idx) {
                    var key = qk(m.c.question) + '|' + ak(m.c.answer);
                    var badge;
                    if (isMerged(m.c.question, m.c.answer)) { badge = '<span class="cc-badge merged">족보에 반영됨</span>'; mergedMine++; }
                    else if (outboxKeys[key]) { badge = '<span class="cc-badge waiting">전송 대기</span>'; waiting++; }
                    else { badge = '<span class="cc-badge sent">서버로 보냄</span>'; }
                    if (badge.indexOf('merged') < 0) unmerged.push({ sheet: m.sheet, question: m.c.question, answer: m.c.answer, note: m.c.note || '' });
                    var q = tidy(m.c.question, true);
                    var ans = tidy(m.c.answer, false);
                    return '<tr><td>' + esc(m.c.time || '') + '</td><td>' + esc(m.sheet) + '</td><td>' + esc(q) +
                        '</td><td class="ans">' + esc(ans) + '</td><td>' + badge + '</td>' +
                        '<td class="cc-acts">' +
                        (badge.indexOf('merged') < 0 ? '<button class="cc-del cc-edit" type="button" data-i="' + idx + '" title="질문·답 고치기">수정</button>' : '') +
                        '<button class="cc-del" type="button" data-i="' + idx + '" title="이 문제 지우기">삭제</button></td></tr>';
                });

                document.getElementById('cards').innerHTML = [
                    [mine.length, '이 브라우저에서 모은 문제'],
                    [mergedMine, '그중 족보에 반영됨'],
                    [waiting, '서버 전송 대기'],
                    [status ? status.merged_total : '-', '족보에 추가된 수집 문제 (전체)'],
                    [status ? status.pending_count : '-', '족보 반영 대기']
                ].map(function (c) {
                    return '<div class="cc-card"><div class="n">' + esc(c[0]) + '</div><div class="t">' + esc(c[1]) + '</div></div>';
                }).join('');

                document.getElementById('mineCount').textContent = mine.length;
                document.getElementById('mine').innerHTML = mine.length
                    ? table(['모은 때', '카테고리', '질문', '답', '상태', ''], mineRows)
                    : '<div class="cc-empty">아직 이 브라우저에서 모은 문제가 없어요.<br>족보 검색 화면의 📷 버튼으로 자동족보를 켜고 \'중단없이\'를 체크한 채 문제를 풀어 보세요.</div>';

                document.getElementById('mergedCount').textContent = merged.length;
                document.getElementById('merged').innerHTML = merged.length
                    ? table(['추가된 날', '카테고리', '질문', '답'], merged.map(function (m) {
                        return '<tr><td>' + esc(m.date) + '</td><td>' + esc(m.sheet) + '</td><td>' + esc(m.q) +
                            '</td><td class="ans">' + esc(m.a) + '</td></tr>';
                    }))
                    : '<div class="cc-empty">아직 족보에 합쳐진 수집 문제가 없어요. 모인 문제는 매일 밤 합쳐집니다.</div>';
                document.getElementById('mergedNote').textContent = status
                    ? '마지막 합친 날: ' + (status.last_merge || '아직 없음') +
                      ' · 보낸 문제는 매일 밤 족보에 합쳐져요.'
                    : '족보 반영 현황을 불러오지 못했어요. 잠시 후 다시 열어 주세요.';

                applyFilter();
            }

            function applyFilter() {
                var v = document.getElementById('filter').value.trim().toLowerCase();
                document.querySelectorAll('.cc-table tbody tr').forEach(function (tr) {
                    tr.style.display = !v || tr.textContent.toLowerCase().indexOf(v) >= 0 ? '' : 'none';
                });
            }

            document.getElementById('filter').addEventListener('input', applyFilter);

            // 삭제: 잘못 읽힌 문제 등을 지운다. 아직 족보에 안 들어간 것은 서버 제출도 취소된다
            // 수정: 질문·답 칸을 입력칸으로 바꿔 직접 고친다 (족보에 이미 들어간 줄은 버튼이 없다)
            function startEdit(tr, m) {
                if (tr.classList.contains('editing')) return;
                tr.classList.add('editing');
                var tidy = window.QplayCollect.tidy;
                var qCell = tr.cells[2], aCell = tr.cells[3], actCell = tr.cells[5];
                qCell.innerHTML = '<textarea class="cc-input" rows="2"></textarea>';
                aCell.innerHTML = '<input class="cc-input" type="text">';
                qCell.firstChild.value = tidy(m.c.question, true);
                aCell.firstChild.value = tidy(m.c.answer, false);
                actCell.innerHTML = '<button class="cc-del cc-save" type="button">저장</button><button class="cc-del cc-cancel" type="button">취소</button>';
                qCell.firstChild.focus();
                function save() {
                    var r = window.QplayCollect.editCollected(m.sheet, m.c.question, m.c.answer, qCell.firstChild.value, aCell.firstChild.value);
                    if (!r.ok) {
                        say(r.error === 'too-short' ? '질문은 4글자 이상, 답은 비우지 말아 주세요.' : '이 문제를 찾지 못했어요. 새로고침 후 다시 해 주세요.', true);
                        return;
                    }
                    say(r.changed ? '고쳤어요. 서버에도 고친 내용으로 다시 보내요.' : '바뀐 내용이 없어요.');
                    render(lastStatus);
                }
                actCell.querySelector('.cc-save').addEventListener('click', save);
                actCell.querySelector('.cc-cancel').addEventListener('click', function () { render(lastStatus); });
                [qCell.firstChild, aCell.firstChild].forEach(function (el) {
                    el.addEventListener('keydown', function (ev) {
                        if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); save(); }
                        else if (ev.key === 'Escape') render(lastStatus);
                    });
                });
            }

            document.getElementById('mine').addEventListener('click', function (e) {
                var editBtn = e.target.closest && e.target.closest('.cc-edit');
                if (editBtn && window.QplayCollect && window.QplayCollect.editCollected) {
                    var em = mineList[Number(editBtn.getAttribute('data-i'))];
                    if (em) startEdit(editBtn.closest('tr'), em);
                    return;
                }
                if (e.target.closest && e.target.closest('.cc-save, .cc-cancel')) return;
                var btn = e.target.closest && e.target.closest('.cc-del');
                if (!btn || !window.QplayCollect || !window.QplayCollect.removeCollected) return;
                var m = mineList[Number(btn.getAttribute('data-i'))];
                if (!m) return;
                var tidy = window.QplayCollect.tidy;
                var merged = btn.closest('tr').querySelector('.cc-badge.merged');
                var msg = '이 문제를 지울까요?' + NL + NL + tidy(m.c.question, true) + NL + '→ ' + tidy(m.c.answer, false) +
                    (merged ? NL + NL + '이미 족보에 들어간 문제라 검색에는 계속 나와요. 이 목록에서만 지워집니다.' : '');
                if (!confirm(msg)) return;
                window.QplayCollect.removeCollected(m.sheet, m.c.question, m.c.answer);
                uploadMsg.className = 'cc-msg';
                uploadMsg.textContent = merged ? '목록에서 지웠어요.' : '지웠어요. 서버에 보낸 것도 취소되어 족보에 합쳐지지 않아요.';
                render(lastStatus);
            });

            // ===== 관리자: 족보에 바로 반영하기 =====
            // 모은 문제를 서버에 올린 뒤, 매일 밤 PC에서 도는 병합 루틴을 클라우드(GitHub Actions)에서 바로 돌린다.
            // 관리자 키가 저장된 브라우저에서만 버튼이 보인다 (키 입력: 주소 끝에 #admin).
            var ADMIN_KEY = 'qplay:admin-key';
            var MERGE_ENDPOINT = 'https://qplay-search.vercel.app/api/merge-now';
            var mergeBtn = document.getElementById('mergeBtn');
            function getAdminKey() { try { return localStorage.getItem(ADMIN_KEY) || ''; } catch (e) { return ''; } }
            function setAdminKey(v) { try { if (v) localStorage.setItem(ADMIN_KEY, v); else localStorage.removeItem(ADMIN_KEY); } catch (e) { /* ignore */ } }
            function showAdmin() {
                var isAdmin = !!getAdminKey();
                mergeBtn.hidden = !isAdmin;
                document.getElementById('adminBox').hidden = location.hash !== '#admin';
            }
            function say(text, isErr) { uploadMsg.className = isErr ? 'cc-msg err' : 'cc-msg'; uploadMsg.textContent = text; }
            function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
            function fetchStatusText() {
                return fetch('collected-status.json?t=' + Date.now(), { cache: 'no-store' })
                    .then(function (r) { return r.ok ? r.text() : ''; })
                    .catch(function () { return ''; });
            }

            document.getElementById('adminSave').addEventListener('click', function () {
                var v = document.getElementById('adminKey').value.trim();
                setAdminKey(v);
                document.getElementById('adminKey').value = '';
                say(v ? '관리자 키를 저장했어요.' : '관리자 키를 지웠어요.');
                history.replaceState(null, '', location.pathname);
                showAdmin();
            });
            window.addEventListener('hashchange', showAdmin);

            mergeBtn.addEventListener('click', function () {
                var key = getAdminKey();
                if (!key || !window.QplayCollect) return;
                mergeBtn.disabled = true;
                var startedAt = Date.now();
                var beforeStatus = '';
                say('1/3 모은 문제를 서버에 올리는 중...');
                fetchStatusText()
                    .then(function (t) { beforeStatus = t; return window.QplayCollect.uploadNow(unmerged.slice()); })
                    .then(function (up) {
                        if (up.failed) throw new Error(up.failed + '개를 서버에 못 올렸어요 (' + up.error + ').');
                        say('2/3 족보 병합을 시작하는 중... (' + up.sent + '개 올림)');
                        return fetch(MERGE_ENDPOINT, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ key: key })
                        });
                    })
                    .then(function (r) {
                        if (r.status === 401) {
                            setAdminKey('');
                            showAdmin();
                            throw new Error('관리자 키가 맞지 않아요. 주소 끝에 #admin 을 붙여 다시 입력해 주세요.');
                        }
                        if (r.status === 503) throw new Error('서버에 GitHub 토큰이 아직 설정되지 않았어요.');
                        if (!r.ok) throw new Error('병합을 시작하지 못했어요 (' + r.status + ').');
                        return pollRun(key, startedAt);
                    })
                    .then(function (run) {
                        if (run.conclusion !== 'success') {
                            var err = new Error('병합 중 문제가 생겼어요.');
                            err.url = run.url;
                            throw err;
                        }
                        say('3/3 병합 끝! 사이트에 반영되길 기다리는 중... (1~2분)');
                        return pollStatus(beforeStatus);
                    })
                    .then(function (changed) {
                        mergeBtn.disabled = false;
                        if (changed) {
                            say('족보에 반영됐어요! 새로 고칠게요.');
                            setTimeout(function () { location.reload(); }, 1200);
                        } else {
                            say('병합은 끝났어요. 새로 합칠 문제가 없었거나 사이트 반영이 늦어지는 중이에요. 잠시 뒤 새로고침해 보세요.');
                        }
                    })
                    .catch(function (e) {
                        mergeBtn.disabled = false;
                        say(e.message || String(e), true);
                        if (e.url) {
                            var a = document.createElement('a');
                            a.href = e.url;
                            a.target = '_blank';
                            a.rel = 'noopener';
                            a.textContent = ' 실행 기록 보기';
                            uploadMsg.appendChild(a);
                        }
                    });
            });

            // 방금 시작한 GitHub Actions 실행이 끝날 때까지 기다린다 (최대 6분)
            function pollRun(key, startedAt) {
                var deadline = Date.now() + 6 * 60 * 1000;
                function tick() {
                    if (Date.now() > deadline) return Promise.reject(new Error('병합이 오래 걸리고 있어요. 몇 분 뒤 새로고침해 보세요.'));
                    return wait(6000)
                        .then(function () { return fetch(MERGE_ENDPOINT + '?key=' + encodeURIComponent(key), { cache: 'no-store' }); })
                        .then(function (r) { return r.ok ? r.json() : null; })
                        .catch(function () { return null; })
                        .then(function (body) {
                            var run = body && body.run;
                            var mine = run && new Date(run.createdAt).getTime() >= startedAt - 10000;
                            if (!mine) return tick();
                            if (run.status !== 'completed') {
                                say('2/3 족보에 합치는 중... (보통 1분 안팎)');
                                return tick();
                            }
                            return run;
                        });
                }
                return tick();
            }

            // GitHub Pages에 새 현황 파일이 올라올 때까지 기다린다 (최대 3분)
            function pollStatus(before) {
                var deadline = Date.now() + 3 * 60 * 1000;
                function tick() {
                    if (Date.now() > deadline) return Promise.resolve(false);
                    return wait(8000).then(fetchStatusText).then(function (t) { return t && t !== before ? true : tick(); });
                }
                return tick();
            }

            var uploadMsg = document.getElementById('uploadMsg');

            // 공유 수집 기능이 생기기 전에 모은 문제는 서버로 간 적이 없다 → 브라우저마다 한 번만 조용히 보낸다
            // (같은 브라우저가 다시 보내도 병합 루틴이 보낸 사람 기준으로 한 번만 센다)
            var BACKFILL_KEY = 'qplay:collected:backfilled';
            function backfillOnce() {
                if (!window.QplayCollect || !window.QplayCollect.uploadNow || !unmerged.length) return;
                try { if (localStorage.getItem(BACKFILL_KEY)) return; } catch (e) { return; }
                window.QplayCollect.uploadNow(unmerged.slice()).then(function (r) {
                    if (!r.failed) { try { localStorage.setItem(BACKFILL_KEY, new Date().toISOString()); } catch (e) { /* ignore */ } }
                    render(lastStatus);
                });
            }

            document.getElementById('downloadBtn').addEventListener('click', function () {
                if (!window.QplayCollect) return;
                var blob = new Blob(['﻿' + window.QplayCollect.toTsv()], { type: 'text/tab-separated-values;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                var d = new Date();
                a.href = url;
                a.download = '모은문제_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.tsv';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            });

            showAdmin();
            render(null);
            fetch('collected-status.json', { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; })
                .then(function (status) {
                    render(status || { merged: [], merged_total: 0, pending_count: 0, last_merge: null });
                    if (status) backfillOnce(); // 족보 반영 여부를 안 뒤에 (이미 반영된 건 보낼 필요 없음)
                });
            // 못 보낸 문제가 있으면 다시 보내고 상태 갱신
            if (window.QplayCollect && window.QplayCollect.pendingUploads() > 0) {
                var before = window.QplayCollect.pendingUploads();
                window.QplayCollect.flushOutbox().then(function () {
                    // 실제로 보내졌을 때만 다시 그림 (실패하면 그대로 두어 무한 새로고침 방지)
                    if (window.QplayCollect.pendingUploads() < before) location.reload();
                });
            }
        })();
    </script>
</body>

</html>
